prefix: "§8[§6Res Publica§8]§r"
help.header: "Commandes disponibles :"
help.tick: "/respublica tick <n> — avance les minuteurs du plugin de n ticks"
help.village: "/respublica village [list|scan|flush|act] — liste les villages, force un scan, l'écriture de villages.json ou une action de chaque rôle"
help.warehouse: "/respublica warehouse set — désigne le tonneau visé comme entrepôt du village où vous êtes"
help.townhall: "/respublica townhall [info|set [x y z]|build] — consulte, désigne (bloc d'or sous un lutrin) ou fait poser l'Hôtel de Ville du village"
help.status: "/respublica status [village] — population, lits et stock du village"
help.territory: "/respublica territory — carte des chunks revendiqués autour de vous (lettre = faction, # = contesté, . = libre)"
help.inspect: "/respublica inspect [uuid] — affiche le rôle et les trois jauges du villageois visé"
help.setrole: "/respublica setrole <rôle> [uuid] — change le rôle du villageois visé"
help.famine: "/respublica famine [village] — vide la nourriture du tonneau-entrepôt pour provoquer une famine"
help.overpopulate: "/respublica overpopulate [village] — fait apparaître des villageois au-delà de lits × ratio"
help.insecurity: "/respublica insecurity [village] — fait apparaître des monstres persistants que les gardes ne couvrent pas"
help.reload: "/respublica reload — relit config.yml"
help.help: "/respublica help — affiche cette aide"
