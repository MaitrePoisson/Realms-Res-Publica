# Realms & Res Publica - configuration d'équilibrage.
# Clés plates ; durées en secondes de simulation. Une valeur non numérique ou hors bornes est
# ignorée (défaut conservé) et signalée dans la console. Défauts identiques à SimConfig.java.

# ---- Monde ----
# Rayon (en blocs) d'un village autour de son centre. [16 ; 256]
village_radius: 64
# Plafond de blocs examinés par tick serveur (protège les performances). [100 ; 100000]
max_scan_blocks_per_tick: 2000
# Intervalle (s) d'écriture groupée de villages.json et des données des villageois. [5 ; 3600]
persistence_flush_s: 60

# ---- Jauges ----
# Points de satiété perdus par minute et par villageois. [0 ; 100]
satiety_decay_per_min: 3.0
# Points de satiété rendus par unité de nourriture mangée. [1 ; 100]
satiety_per_food: 25
# Un villageois mange quand sa satiété passe sous ce seuil. [1 ; 100]
eat_below_satiety: 50
# Vitesse (points/s) à laquelle le moral rejoint sa cible. [0.01 ; 10]
morale_speed_per_s: 0.5
# Moral de base de la cible (sans satiété, lit ni sécurité). [0 ; 100]
morale_base: 10
# Poids de la satiété (0-1) dans le moral cible. [0 ; 1]
morale_w_satiety: 0.5
# Bonus de moral cible pour un villageois qui dispose d'un lit. [0 ; 100]
morale_bed_bonus: 20
# Bonus de moral cible quand le village est en sécurité (aucune menace). [0 ; 100]
morale_security_bonus: 20
# Malus de moral cible en cas de surpopulation (villageois > lits x ratio). [0 ; 100]
morale_crowding_penalty: 20
# Malus de moral cible quand les menaces dépassent ce que les gardes couvrent (insécurité). [0 ; 100]
morale_insecurity_penalty: 30
# Vitesse (points/s) à laquelle la loyauté rejoint sa cible. [0.01 ; 10]
loyalty_speed_per_s: 0.2
# Bonus de loyauté cible quand le village compte un diplomate. [0 ; 50]
loyalty_diplomat_bonus: 10
# Sous ce moral, la loyauté baisse en plus de sa convergence. [0 ; 100]
loyalty_low_morale: 55
# Perte de loyauté supplémentaire (points/s) quand le moral est bas. [0 ; 10]
loyalty_low_morale_decay_per_s: 0.4
# Sous ce moral, un villageois ne travaille plus (désobéissance). [0 ; 100]
disobey_morale: 25

# ---- Démographie ----
# Intervalle minimal (s) entre deux naissances dans un village. [1 ; 86400]
birth_interval_s: 300
# Nourriture stockée minimale pour qu'une naissance ait lieu. [0 ; 10000]
birth_food_threshold: 10
# Nourriture consommée par naissance. [0 ; 1000]
birth_food_cost: 4
# Population maximale d'un village. [1 ; 1000]
max_population: 40

# ---- Crises ----
# Durée (s) d'un jour de simulation. [10 ; 86400]
day_length_s: 1200
# Nourriture consommée par villageois et par jour (calcul des jours restants). [0.1 ; 100]
food_per_villager_per_day: 4.0
# Famine quand les jours de nourriture restants passent sous ce seuil. [0 ; 100]
famine_days_threshold: 2.0
# Surpopulation quand villageois > lits x ce ratio. [0.5 ; 10]
overpopulation_ratio: 1.0
# Insécurité quand menaces > gardes x cette valeur (sans garde : toute menace). [0.1 ; 100]
insecurity_threats_per_guard: 2.0
# Durée (s) d'indicateur de crise soutenu avant la contestation. [1 ; 86400]
contest_after_s: 120
# Multiplicateur de la perte de loyauté en contestation. [1 ; 10]
contest_decay_penalty: 2.0
# Les villageois dont la loyauté passe sous ce seuil peuvent être exilés. [0 ; 100]
exile_loyalty: 30
# Durée (s) de contestation avec loyauté basse avant l'exil. [1 ; 86400]
exile_after_s: 180
# Part (0-1) de la nourriture du stock emportée par les exilés. [0 ; 1]
exile_food_share: 0.3
# Part (0-1) des exilés qui deviennent gardes du campement. [0 ; 1]
camp_guard_share: 0.4
# Part maximale (0-1) de la population qui peut partir en un seul exil (les plus mécontents d'abord) ; un garde reste toujours au village. [0.05 ; 1]
exile_max_share: 0.5
# Loyauté ajoutée au seuil d'exil quand les dissidents rentrent au village après une trêve (cause disparue). [0 ; 70]
reconcile_loyalty_bonus: 20
# Distance (blocs) entre le village et le campement dissident. [20 ; 1000]
camp_distance: 80
# Durée (s) de tension élevée avant que la guerre civile éclate. [1 ; 86400]
war_after_s: 120
# Seuil de tension T déclenchant la guerre (voir DESIGN.md). [0 ; 200]
war_tension: 60
# Tension ajoutée quand aucun diplomate vivant n'est présent. [0 ; 100]
war_no_diplomat_penalty: 10
# Relations (0-100) à atteindre pour qu'une trêve soit signée. [0 ; 100]
truce_relations: 70
# Dégâts (PV) d'une frappe de garde pendant la guerre civile, une frappe par seconde. [0.5 ; 100]
war_damage: 4
# Vitesse de redescente des minuteurs de crise quand l'indicateur disparaît (s perdues par s). [0.01 ; 10]
crisis_recovery_factor: 0.25

# ---- Rôles ----
# Intervalle (s) entre deux actions d'un rôle pour un villageois. [1 ; 3600]
behavior_interval_s: 10
# Rayon (blocs) autour du villageois où il travaille. [2 ; 128]
work_radius: 16
# Nombre de villageois qui agissent par tick (étale la charge d'une cadence sur plusieurs ticks). [1 ; 1000]
behaviors_per_tick: 4
# Relations gagnées à chaque visite réussie du diplomate. [0 ; 100]
relations_per_visit: 5
# Bois (planches ou troncs) consommé dans l'entrepôt pour bâtir une hutte avec un lit. [4 ; 500]
hut_wood: 30
# Rayon (blocs) du cœur du village autour de l'Hôtel de Ville. [4 ; 64]
town_hall_radius: 12
# Rayon (blocs) autour de l'Hôtel de Ville où coffres et tonneaux forment le stock communautaire. [2 ; 16]
store_radius: 5
# Nombre maximal de coffres que les collecteurs ajoutent d'eux-mêmes quand le stock est plein. [1 ; 30]
max_chests: 6
# Stock de bois que le village doit avoir avant que l'intendant commande un bâtiment. [0 ; 100000]
expansion_wood_quota: 60
# Stock de pierre que le village doit avoir avant que l'intendant commande un bâtiment. [0 ; 100000]
expansion_stone_quota: 40
# Population minimale du village avant toute commande de bâtiment. [0 ; 1000]
expansion_population_quota: 6
# Nombre maximal d'ordres de construction en attente par village. [1 ; 50]
max_build_orders: 3
# Stock de pierre a partir duquel les routes de terre sont pavees (1 pierre pour 2 positions pavees). [0 ; 100000]
road_pave_stone_stock: 60
# Population minimale du village avant de paver ses routes. [0 ; 1000]
road_pave_population: 8
# Distance maximale (blocs) a laquelle une route relie l'Hotel de Ville a un autre village ou campement. 0 = jamais. [0 ; 1000]
road_link_distance: 160
# Population a partir de laquelle le village se fortifie (palissade + tours de guet). [0 ; 1000]
defense_population: 12
# Menaces simultanees a partir desquelles le village se fortifie, meme petit. [0 ; 1000]
defense_threats: 3
# Rayon (blocs) de l'enceinte autour de l'Hotel de Ville. [4 ; 60]
defense_ring_radius: 30
# Stock de pierre a partir duquel la palissade de bois est remplacee par des murs de pierre. [0 ; 100000]
defense_stone_stock: 80
# Population minimale avant de remplacer la palissade par des murs de pierre. [0 ; 1000]
defense_stone_population: 14
# Rayon d'influence (en chunks) de l'Hotel de Ville d'un village. [1 ; 16]
territory_hall_radius: 4
# Rayon d'influence (en chunks) d'un avant-poste, d'un campement ou d'une tour de guet. [1 ; 16]
territory_outpost_radius: 2
# Influence minimale pour qu'une faction possede un chunk. [0.01 ; 1]
territory_owner_threshold: 0.2
# Ecart d'influence sous lequel un chunk est conteste entre deux factions. [0 ; 1]
territory_contest_margin: 0.1
# Les villageois travaillent aussi dans les chunks d'un voisin (1 = oui, 0 = ils les evitent). [0 ; 1]
territory_trespass: 0
# Provocation ajoutee a chaque action de travail dans un chunk voisin. [0 ; 100]
provocation_per_act: 1
# Provocation a partir de laquelle le proprietaire avertit l'intrus. [0 ; 1000]
provocation_warn: 3
# Provocation a partir de laquelle les gardes du proprietaire expulsent les intrus. [0 ; 1000]
provocation_expel: 6
# Provocation a partir de laquelle une guerre de frontiere eclate. [0 ; 1000]
provocation_war: 10
# Provocation perdue par seconde. [0 ; 10]
provocation_decay_s: 0.02
# Indice relationnel de depart entre deux villes de doctrines amies (cites marchandes). [0 ; 100]
relation_base_trade: 40
# Indice relationnel de depart entre deux villes de doctrines ennemies. [-100 ; 0]
relation_base_hostile: -40
# Indice a partir duquel deux villes sont partenaires commerciales. [0 ; 100]
relation_trade_at: 30
# Indice en dessous duquel deux villes sont hostiles. [-100 ; 0]
relation_hostile_at: -30
# Indice perdu a chaque incident de frontiere. [0 ; 100]
relation_incident_penalty: 15
# Retour de l'indice vers sa base, par seconde. [0 ; 10]
relation_decay_s: 0.05
# Secondes entre deux recherches de troc entre villes partenaires (0 = jamais). [0 ; 100000]
caravan_interval_s: 120
# Stock a partir duquel une ressource est un surplus a echanger. [1 ; 100000]
caravan_surplus: 100
# Stock sous lequel une ressource manque (reserve gardee par le vendeur). [0 ; 100000]
caravan_deficit: 40
# Quantite maximale transportee par une caravane. [1 ; 1000]
caravan_max_load: 32
# Gardes d'escorte maximum (chacun divise par deux le risque d'embuscade). [0 ; 4]
caravan_escorts: 2
# Probabilite d'embuscade sans escorte. [0 ; 1]
caravan_ambush_chance: 0.1
# Duree maximale d'un trajet avant arrivee forcee, en secondes. [10 ; 100000]
caravan_timeout_s: 180
# Indice relationnel gagne par un echange reussi. [0 ; 100]
caravan_relation_gain: 8
# Indice relationnel perdu par une caravane perdue. [0 ; 100]
caravan_relation_loss: 10
# Secondes entre deux evaluations diplomatiques (traites, alliances, declarations) (0 = jamais). [0 ; 100000]
diplomacy_interval_s: 30
# Indice a partir duquel une alliance defensive est possible contre un ennemi commun. [0 ; 100]
diplomacy_alliance_at: 60
# Incidents de frontiere entre deux villes qui declenchent une declaration de guerre. [1 ; 1000]
diplomacy_war_incidents: 3
# Delai (secondes) entre l'annonce d'une guerre et son ouverture ; un diplomate peut l'annuler. [0 ; 100000]
diplomacy_war_delay_s: 30
# Indice gagne quand un diplomate calme un conflit annonce. [0 ; 100]
diplomacy_calm_gain: 25
# Stock de vivres sous lequel une ville est en penurie critique. [0 ; 100000]
diplomacy_critical_food: 10
# Delai entre deux mises a jour des regiments (mobilisation, equipement, marche). 0 = desactive. [0 ; 100000]
mobilization_interval_s: 10
# Part maximale de la population mobilisable en regiment. [0 ; 1]
mobilization_share: 0.5
# Fer pris a l'entrepot pour forger une epee. [0 ; 100]
mobilization_sword_ore: 2
# Fer pris a l'entrepot pour forger une armure. [0 ; 100]
mobilization_armor_ore: 4
# Bois pris a l'entrepot pour fabriquer un arc. [0 ; 100]
mobilization_bow_wood: 2
# Delai entre deux mises a jour des sieges (assemblage, tirs, degats des defenseurs). 0 = desactive. [0 ; 100000]
siege_interval_s: 10
# Distance (blocs) entre l'hotel de ville ennemi et le point d'assemblage des machines. [4 ; 200]
siege_standoff: 18
# Nombre maximal de blocs detruits par un siege (belier + catapulte). [0 ; 1000]
siege_block_cap: 12
# Points de vie du belier. [1 ; 10000]
siege_ram_hp: 40
# Points de vie de la catapulte. [1 ; 10000]
siege_catapult_hp: 30
# Bois pris a l'entrepot de l'attaquant pour assembler un belier. [0 ; 1000]
siege_ram_wood: 8
# Bois pris a l'entrepot de l'attaquant pour assembler une catapulte. [0 ; 1000]
siege_catapult_wood: 12
# Portee (blocs) du belier : portes et portails en bois. [1 ; 100]
siege_ram_range: 8
# Portee (blocs) de la catapulte : blocs de rempart. [1 ; 100]
siege_catapult_range: 24
# Distance (blocs) a laquelle un defenseur peut attaquer une machine. [1 ; 100]
siege_defender_range: 12
# Points de vie retires a une machine par defenseur a portee et par mise a jour. [0 ; 1000]
siege_defender_damage: 10
# Delai entre deux examens des guerres en cours. 0 = desactive. [0 ; 100000]
war_resolve_interval_s: 10
# Duree minimale d'une guerre avant toute resolution (s). [0 ; 100000]
war_resolve_min_s: 60
# Duree maximale d'une guerre : au-dela, le verdict tombe (s). [0 ; 1000000]
war_resolve_max_s: 600
# Rapport de puissance a partir duquel le vainqueur pille (en dessous : repli). [1 ; 100]
war_pillage_at: 1.2
# Rapport de puissance a partir duquel le vainqueur annexe le vaincu et leve un tribut. [1 ; 100]
war_annex_at: 2
# Rapport de puissance a partir duquel (breche pleine) l'hotel de ville du vaincu est detruit. [1 ; 100]
war_destroy_at: 3
# Part de chaque stock de l'entrepot du vaincu emportee par un pillage. [0 ; 1]
war_loot_share: 0.3
# Plafond d'un pillage, par ressource. [0 ; 100000]
war_loot_cap: 64
# Part de chaque stock versee en tribut par un village annexe a chaque echeance. [0 ; 1]
war_tribute_share: 0.1
# Plafond d'un versement de tribut, par ressource. [0 ; 100000]
war_tribute_cap: 32
# Intervalle entre deux versements de tribut (s, un jour de jeu). 0 = desactive. [0 ; 1000000]
war_tribute_period_s: 1200
# Indice de relation regagne par le couple au cessez-le-feu. [0 ; 200]
war_peace_gain: 30
# Lits libres que les bâtisseurs cherchent à garder en réserve (sans lit libre, aucune naissance). [0 ; 20]
builder_spare_beds: 2
# Loyauté gagnée par un villageois quand le diplomate, sans village voisin, lui parle. [0 ; 50]
talk_loyalty_bonus: 2
# Delai (s) avant qu'un joueur puisse changer de role (revenir a Observateur est toujours libre). [0 ; 1000000]
role_switch_cooldown_s: 300
# Cout (emeraudes de la bourse) pour fonder un village en tant que Souverain. [0 ; 100000]
found_cost: 5
# Distance minimale (blocs) entre un nouveau village de joueur et un village existant. [0 ; 100000]
found_min_distance: 96
# Nombre maximal de villages diriges par un meme Souverain. [0 ; 100]
found_max_per_player: 1
# Part maximale de la population qu'un Souverain peut mobiliser par decret. [0 ; 1]
law_conscription_max: 0.6
# Taux d'impot maximal par ressource fixe par un Souverain. [0 ; 1]
tax_max_rate: 0.5
# Periode (s) de la collecte des impots (1200 = un jour Minecraft). [0 ; 1000000]
tax_period_s: 1200
# Production par villageois et par periode sur laquelle porte l'impot. [0 ; 100]
tax_per_villager: 2
# Somme des taux sans mecontentement ; au-dela, chaque villageois perd de la loyaute. [0 ; 10]
tax_free_burden: 0.5
# Loyaute perdue par villageois et par periode pour chaque point de taux au-dessus du seuil. [0 ; 1000]
tax_unrest_per_point: 20
# Paie de base (emeraudes) d'un contrat de nettoyage de campement. [0 ; 10000]
contract_pay_base: 3
# Supplement de paie par pillard du campement. [0 ; 1000]
contract_pay_per_raider: 1
# Paie (emeraudes) d'un contrat de guerre affiche par un village. [0 ; 10000]
contract_war_pay: 8
# Periode (s) entre deux affichages automatiques de contrats par les villages. [0 ; 1000000]
contract_post_period_s: 600
# Duree (s) apres laquelle un contrat que personne n'accepte expire et rend la paie. [0 ; 1000000]
contract_open_ttl_s: 3600
# Duree (s) laissee au mercenaire pour remplir un contrat accepte. [0 ; 1000000]
contract_timeout_s: 1800
# Nombre maximal de contrats acceptes en meme temps par un mercenaire. [1 ; 20]
contract_max_per_mercenary: 2
# Nombre maximal de contrats ouverts en meme temps par un village. [1 ; 20]
contract_max_per_village: 2
# Variation de l'indice de relation apres un contrat reussi (camp adverse ou village d'origine du campement). [0 ; 100]
contract_relation_shift: 10
# Affiche le rôle au-dessus des villageois (1 = oui, 0 = non). [0 ; 1]
show_role_names: 1
# Affiche à chaque joueur, dans un village, une barre d'action (population, nourriture, crise). [0 ; 1]
show_action_bar: 1
